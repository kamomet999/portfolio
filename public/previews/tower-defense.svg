<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#71a054"/>
  <!-- grass checker -->
  <g fill="#7aa85c">
    <rect x="0" y="0" width="100" height="90"/><rect x="200" y="0" width="100" height="90"/><rect x="400" y="0" width="100" height="90"/><rect x="600" y="0" width="100" height="90"/>
    <rect x="100" y="90" width="100" height="90"/><rect x="300" y="90" width="100" height="90"/><rect x="500" y="90" width="100" height="90"/><rect x="700" y="90" width="100" height="90"/>
    <rect x="0" y="180" width="100" height="90"/><rect x="200" y="180" width="100" height="90"/><rect x="400" y="180" width="100" height="90"/><rect x="600" y="180" width="100" height="90"/>
    <rect x="100" y="270" width="100" height="90"/><rect x="300" y="270" width="100" height="90"/><rect x="500" y="270" width="100" height="90"/><rect x="700" y="270" width="100" height="90"/>
    <rect x="0" y="360" width="100" height="90"/><rect x="200" y="360" width="100" height="90"/><rect x="400" y="360" width="100" height="90"/><rect x="600" y="360" width="100" height="90"/>
  </g>
  <!-- path -->
  <path d="M0 90 H600 V270 H200 V360 H800" stroke="#d9c28e" stroke-width="80" fill="none"/>
  <!-- units -->
  <circle cx="300" cy="90" r="32" fill="#4a7fd4" stroke="#243b53" stroke-width="4"/>
  <text x="300" y="102" font-size="36" text-anchor="middle">🗡️</text>
  <circle cx="450" cy="180" r="32" fill="#3da06a" stroke="#243b53" stroke-width="4"/>
  <text x="450" y="192" font-size="36" text-anchor="middle">🏹</text>
  <circle cx="200" cy="320" r="32" fill="#8f4ad4" stroke="#243b53" stroke-width="4"/>
  <text x="200" y="332" font-size="36" text-anchor="middle">🔮</text>
  <!-- enemies -->
  <circle cx="120" cy="90" r="26" fill="#7da33d" stroke="#243b53" stroke-width="4"/>
  <text x="120" y="100" font-size="28" text-anchor="middle">👺</text>
  <circle cx="60" cy="90" r="26" fill="#b03a3a" stroke="#243b53" stroke-width="4"/>
  <text x="60" y="100" font-size="28" text-anchor="middle">👹</text>
  <!-- castle -->
  <text x="730" y="375" font-size="56" text-anchor="middle">🏰</text>
  <!-- title banner -->
  <rect x="0" y="0" width="800" height="56" fill="#0f172a" opacity="0.85"/>
  <text x="400" y="38" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="sans-serif">⚔️ 王国防衛戦 — Tower Defense</text>
